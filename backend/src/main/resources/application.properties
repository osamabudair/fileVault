spring.application.name=filevault-backend
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=native

spring.profiles.active=local

# PostgreSQL Database Configuration (Environment Placeholders)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Dual-Token Configuration (15m Access Token, 7d Refresh Token)
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# Multipart Upload & User Storage Quota Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}
file.storage.upload-dir=${UPLOAD_DIR:uploads}
file.storage.max-user-quota-bytes=${MAX_USER_QUOTA_BYTES:53687091200}
